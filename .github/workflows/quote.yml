name: Update Quote

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Generate Quote SVG
        run: |
          QUOTE=$(curl -s https://api.quotable.io/random | jq -r '.content')
          AUTHOR=$(curl -s https://api.quotable.io/random | jq -r '.author')

          echo "<svg xmlns='http://www.w3.org/2000/svg' width='800' height='200'>
          <rect width='100%' height='100%' fill='#161b22'/>
          <text x='50%' y='40%' dominant-baseline='middle' text-anchor='middle' fill='white' font-size='20' font-family='Arial' font-style='italic'>
          \"$QUOTE\"
          </text>
          <text x='50%' y='70%' dominant-baseline='middle' text-anchor='middle' fill='#a9d2ff' font-size='16' font-family='Arial'>
          - $AUTHOR
          </text>
          </svg>" > quote.svg

      - name: Commit changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add quote.svg
          git commit -m "Update quote" || exit 0
          git push
