<svg width="500" height="200" viewBox="0 0 500 200" xmlns="http://www.w3.org/2000/svg">
  <rect width="490" height="190" x="5" y="5" rx="15" fill="#0d1117" stroke="#f06292" stroke-width="3"/>
  <text x="250" y="70" fill="white" font-family="Arial, sans-serif" font-size="18" text-anchor="middle">"As machines get to be more and more like men,</text>
